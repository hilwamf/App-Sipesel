<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register SIPESEL</title>
    <link href="./src/output.css" rel="stylesheet">
</head>

<body 
    style="background-image: url('images/kios2.jpg');"
    class="min-h-screen bg-cover bg-center flex items-center justify-center">

    <!-- Overlay -->
    <div class="absolute inset-0 bg-black/60"></div>

    <!-- CONTAINER -->
    <div class="relative z-10 flex w-[90%] max-w-5xl rounded-2xl overflow-hidden shadow-2xl">

        <!-- LEFT (INFO) -->
        <div class="hidden md:flex w-1/2 bg-green-900/80 flex-col items-center justify-center text-white p-8 text-center">
            <h1 class="text-4xl font-bold text-yellow-400 mb-2">SIPESEL</h1>
            <p class="opacity-80">Sistem Pengelolaan Sewa Kios</p>
        </div>

        <!-- RIGHT (FORM) -->
        <div class="w-full md:w-1/2 bg-white p-8 md:p-10">

            <h2 class="text-2xl font-semibold text-green-800 mb-6">
                Form Pendaftaran
            </h2>

            <form id="registerForm" class="space-y-4">

                <input type="text" id="nama" placeholder="Nama Lengkap" required
                    class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-green-700 outline-none">

                <input type="text" placeholder="Kios" required
                    class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-green-700 outline-none">

                <input type="text" placeholder="NIK" required
                    class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-green-700 outline-none">

                <input type="text" placeholder="Nomor Telepon" required
                    class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-green-700 outline-none">

                <input type="email" placeholder="Email" required
                    class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-green-700 outline-none">

                <input type="text" placeholder="Username" required
                    class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-green-700 outline-none">

                <input type="password" placeholder="Password" required
                    class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-green-700 outline-none">

                <!-- GENDER -->
                <div>
                    <p class="text-sm text-gray-600 mb-2">Gender</p>
                    <div class="flex gap-4">
                        <label class="flex items-center gap-2 cursor-pointer">
                            <input type="radio" name="gender" value="Laki-laki" required>
                            <span>Laki-laki</span>
                        </label>

                        <label class="flex items-center gap-2 cursor-pointer">
                            <input type="radio" name="gender" value="Perempuan">
                            <span>Perempuan</span>
                        </label>
                    </div>
                </div>

                <button type="submit"
                    class="w-full bg-green-700 text-white py-3 rounded-lg font-semibold hover:bg-green-900 hover:scale-[1.02] transition">
                    DAFTAR
                </button>

            </form>

            <p class="text-sm text-center mt-4 text-gray-600">
                Sudah punya akun?
                <a href="login.html" class="text-green-700 font-semibold hover:underline">
                    Login sekarang
                </a>
            </p>

        </div>

    </div>

<script>
document.addEventListener("DOMContentLoaded", function(){

    const form = document.getElementById("registerForm");
    const namaInput = document.getElementById("nama");

    form.addEventListener("submit", function(e){
        e.preventDefault();

        const regexNama = /^[a-zA-Z0-9' ]+$/;

        if (!regexNama.test(namaInput.value)) {
            alert("Nama hanya boleh huruf, angka, spasi dan tanda petik (')!");
            namaInput.focus();
            return;
        }

        const inputs = form.querySelectorAll("input");
        let lengkap = true;

        inputs.forEach(input => {
            if(input.type !== "radio" && input.value.trim() === ""){
                lengkap = false;
            }
        });

        const gender = form.querySelector('input[name="gender"]:checked');

        if(!lengkap || !gender){
            alert("Form harus diisi semua! ⚠️");
            return;
        }

        alert("Berhasil daftar 🎉");

        setTimeout(function(){
            window.location.href = "login.html";
        }, 1500);
    });

});
</script>

</body>
</html>
