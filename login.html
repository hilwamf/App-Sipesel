<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login SIPESEL</title>
    <link href="./src/output.css" rel="stylesheet">
</head>

<body 
    style="background-image: url('images/kios-pasar.jpg.jpeg');"
    class="min-h-screen flex items-center justify-center bg-cover bg-center">

    <!-- Overlay -->
    <div class="absolute inset-0 bg-black/50"></div>

    <!-- LOGIN CARD -->
    <div class="relative z-10 bg-white/10 backdrop-blur-lg p-8 md:p-10 rounded-2xl w-[90%] max-w-sm text-white text-center shadow-2xl">

        <!-- LOGO -->
        <img src="images/logo-sipesel.png" class="w-24 mx-auto mb-4">

        <!-- TITLE -->
        <h2 class="text-xl md:text-2xl font-semibold mb-6">LOGIN</h2>

        <!-- FORM -->
        <form onsubmit="login(event)" class="space-y-4">

            <input type="text" id="username" placeholder="Username" required
class="w-full p-3 rounded-lg bg-white text-black outline-none focus:ring-2 focus:ring-yellow-400">

<input type="password" id="password" placeholder="Password" required
class="w-full p-3 rounded-lg bg-white text-black outline-none focus:ring-2 focus:ring-yellow-400">

            <button 
                class="w-full bg-green-700 py-3 rounded-lg font-semibold hover:bg-green-900 hover:scale-[1.02] transition">
                LOGIN
            </button>

            <p class="text-sm">
                Belum punya akun?
                <a href="register.html" class="text-yellow-400 hover:underline">
                    Daftar di sini
                </a>
            </p>

        </form>

    </div>

<script>
function login(event){
    event.preventDefault();

    const username = document.getElementById("username").value;

    // ✅ SESSION (sementara, hilang kalau tab ditutup)
    sessionStorage.setItem("user", username);

    // ✅ COOKIE (bisa disimpan lebih lama)
    document.cookie = "user=" + username + "; max-age=3600; path=/";

    window.location.href = "dashboard.html";
}
</script>

</body>
</html>
